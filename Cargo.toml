[package]
name = "anchor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first context engine and synchronization daemon that grounds AI models in multi-repository codebases, enterprise domains, wikis, API approval portals and trackers."
readme = "README.md"
license = "MIT"
repository = "https://github.com/David-A-Phillips/anchor"
homepage = "https://github.com/David-A-Phillips/anchor"
authors = ["David <phillipsadavid@gmail.com>"]
keywords = ["context", "mcp", "code-search", "knowledge-graph", "daemon"]
categories = ["command-line-utilities", "development-tools"]
# Set to true (or remove) when publishing to crates.io; the crate name must be free there.
publish = false
build = "build.rs"

[lib]
name = "anchor"
path = "src/lib.rs"

[[bin]]
name = "anchor"
path = "src/main.rs"

[features]
default = ["embed-candle"]
# Local sentence-embedding inference with Candle (pure Rust, no Python/ONNX runtime).
# Without it the deterministic hashing embedder and the Ollama embedder remain available.
embed-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
# --- async runtime, web, transport ---------------------------------------------------------
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = { version = "0.3.34", features = ["sink"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros", "http2"] }
# TLS everywhere goes through rustls + ring: no OpenSSL headers, cmake or protoc are needed to build.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tonic = { version = "0.14.9", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# --- file watching, parsing, graph, storage ------------------------------------------------
notify = "8.2.2"
ignore = "0.4.34"
globset = "0.4.21"
walkdir = "2.5.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
petgraph = "0.8.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }

# --- local embeddings (Candle) --------------------------------------------------------------
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

# --- serialization, hashing, crypto, compression -------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
serde_yaml_ng = "0.10.0"
blake3 = "1.8.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
zstd = "0.14.4"
flate2 = "1.1.11"
tar = "0.4.46"
hex = "0.4.3"
sha2 = "0.11.1"

# --- source format parsing ------------------------------------------------------------------
scraper = "0.29.0"
regex = "1.13.1"

# --- CLI, wizard, observability -------------------------------------------------------------
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6"
clap_mangen = "0.2"
inquire = "0.9.4"
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = "0.40.3"

# --- utilities ------------------------------------------------------------------------------
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
parking_lot = "0.13.0"
rayon = "1.12.0"
lru = "0.19.0"
directories = "6.0.0"
which = "8.0.6"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["signal", "process", "fs", "resource"] }

[build-dependencies]
# gRPC code generation without a system `protoc`: protox is a pure-Rust protobuf compiler.
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
predicates = "3.1.4"
proptest = "1.12.0"
# Test-only: the dashboard is driven through `ServiceExt::oneshot`, and the Atlassian mock checks
# Basic credentials.
tower = { version = "0.5.3", features = ["util"] }
base64 = "0.23.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
# Every public item is documented and every public type is printable; keep it that way.
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
redundant_lifetimes = "warn"
explicit_outlives_requirements = "warn"

# `clippy::all` plus a curated slice of `pedantic`, `nursery` and `restriction`. The principle:
# enable what finds defects or removes ambiguity and what the code base already satisfies, so the
# set is a ratchet and not a backlog. Lints that are stylistic or whose fixes would churn thousands
# of lines without changing behaviour stay off on purpose: `must_use_candidate`,
# `missing_errors_doc`, `use_self`, `missing_const_for_fn`, `redundant_pub_crate`, `doc_markdown`,
# `too_many_lines`, `cast_precision_loss`, `similar_names`, `option_if_let_else`,
# `return_self_not_must_use`, `derive_partial_eq_without_eq` and `significant_drop_tightening`.
# The `cast_*` family is also off: the casts that remain are bounded by construction (line numbers,
# SQLite row ids, dimensions) and each risky one was reviewed by hand rather than allow-listed.
[lints.clippy]
all = { level = "warn", priority = -1 }

# Panics on untrusted input: unwrap is allowed only in tests (see clippy.toml); debugging leftovers.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
lossy_float_literal = "warn"
str_to_string = "warn"

# Correctness and robustness.
manual_assert = "warn"
unnecessary_wraps = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
missing_panics_doc = "warn"
mut_mut = "warn"
option_option = "warn"
implicit_hasher = "warn"
comparison_chain = "warn"
match_bool = "warn"
semicolon_if_nothing_returned = "warn"
missing_fields_in_debug = "warn"
significant_drop_in_scrutinee = "warn"
ref_option = "warn"
unused_async = "warn"

# Readability and consistency.
manual_let_else = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
needless_continue = "warn"
redundant_else = "warn"
unnested_or_patterns = "warn"
match_wildcard_for_single_variants = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
filter_map_next = "warn"
ignored_unit_patterns = "warn"
if_not_else = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
needless_for_each = "warn"
stable_sort_primitive = "warn"
unnecessary_semicolon = "warn"
single_char_pattern = "warn"
string_add_assign = "warn"
range_plus_one = "warn"
range_minus_one = "warn"
manual_is_variant_and = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
unnecessary_join = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"

# Tests assert real latency budgets (e.g. file change -> graph mutation < 50 ms), so the dev/test
# profile optimises dependencies fully (tree-sitter, SQLite, BLAKE3, zstd are C/SIMD heavy) and the
# crate itself lightly. This keeps `cargo test` representative without release-build link times.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.bench]
inherits = "release"

[[bench]]
name = "engine"
harness = false

# --- distribution packages (see RELEASING.md, docs/install.md) ------------------------------------
# The Debian/RPM package is called `anchor-context` (the binary stays `anchor`): Debian and
# Fedora already ship unrelated software called "anchor". Run `packaging/gen-assets.sh` first so
# the completions and man page below exist.
[package.metadata.deb]
name = "anchor-context"
maintainer = "David <phillipsadavid@gmail.com>"
copyright = "Copyright (C) 2026 David Phillips"
license-file = ["LICENSE", "0"]
section = "devel"
priority = "optional"
depends = "$auto, adduser"
recommends = "git, ca-certificates"
suggests = "gh"
extended-description = """\
Anchor builds a local knowledge graph of your repositories, wikis, tickets, pull requests and \
API approval portals, keeps it fresh by watching for changes, and serves grounded context to AI \
models and agents (including over the Model Context Protocol).
.
This package installs the `anchor` command, a systemd user unit for the local daemon \
(anchor.service) and a system unit for the team sync server (anchor-server.service). Neither \
is enabled or started automatically. The git command-line tool is used for history and blame, \
and gh for fetching from GitHub."""
conf-files = ["/etc/anchor/anchor.toml"]
changelog = "packaging/deb/changelog"
maintainer-scripts = "packaging/deb/"
assets = [
    ["target/release/anchor", "usr/bin/anchor", "755"],
    ["README.md", "usr/share/doc/anchor-context/README.md", "644"],
    ["docs/install.md", "usr/share/doc/anchor-context/install.md", "644"],
    ["docs/ARCHITECTURE.md", "usr/share/doc/anchor-context/ARCHITECTURE.md", "644"],
    ["docs/atlassian.md", "usr/share/doc/anchor-context/atlassian.md", "644"],
    ["packaging/etc/anchor.toml", "etc/anchor/anchor.toml", "644"],
    ["packaging/systemd/anchor.service", "usr/lib/systemd/user/anchor.service", "644"],
    ["packaging/systemd/anchor-server.service", "usr/lib/systemd/system/anchor-server.service", "644"],
    ["target/assets/anchor.bash", "usr/share/bash-completion/completions/anchor", "644"],
    ["target/assets/_anchor", "usr/share/zsh/vendor-completions/_anchor", "644"],
    ["target/assets/anchor.fish", "usr/share/fish/vendor_completions.d/anchor.fish", "644"],
    ["target/assets/anchor.1", "usr/share/man/man1/anchor.1", "644"],
    ["packaging/deb/lintian-overrides", "usr/share/lintian/overrides/anchor-context", "644"],
]

[package.metadata.generate-rpm]
name = "anchor-context"
summary = "Local-first context engine and sync daemon for AI models"
license = "MIT"
url = "https://github.com/David-A-Phillips/anchor"
# Account creation on install and cleanup on final uninstall (neither starts a service).
pre_install_script = '''
# Creates the unprivileged `anchor` account used by anchor-server.service. Does not start anything.
getent group anchor >/dev/null || groupadd -r anchor
getent passwd anchor >/dev/null || \
    useradd -r -g anchor -d /var/lib/anchor -M -s /sbin/nologin -c "Anchor sync server" anchor
exit 0
'''
post_uninstall_script = '''
# Remove the account and data only on final uninstall.
if [ "$1" = "0" ]; then
    rm -rf /var/lib/anchor
    rm -f /etc/anchor/server.env
    getent passwd anchor >/dev/null && userdel anchor >/dev/null 2>&1 || true
fi
exit 0
'''
assets = [
    { source = "target/release/anchor", dest = "/usr/bin/anchor", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/anchor-context/README.md", mode = "644", doc = true },
    { source = "docs/install.md", dest = "/usr/share/doc/anchor-context/install.md", mode = "644", doc = true },
    { source = "docs/ARCHITECTURE.md", dest = "/usr/share/doc/anchor-context/ARCHITECTURE.md", mode = "644", doc = true },
    { source = "docs/atlassian.md", dest = "/usr/share/doc/anchor-context/atlassian.md", mode = "644", doc = true },
    { source = "packaging/etc/anchor.toml", dest = "/etc/anchor/anchor.toml", mode = "644", config = true },
    { source = "packaging/systemd/anchor.service", dest = "/usr/lib/systemd/user/anchor.service", mode = "644" },
    { source = "packaging/systemd/anchor-server.service", dest = "/usr/lib/systemd/system/anchor-server.service", mode = "644" },
    { source = "target/assets/anchor.bash", dest = "/usr/share/bash-completion/completions/anchor", mode = "644" },
    { source = "target/assets/_anchor", dest = "/usr/share/zsh/site-functions/_anchor", mode = "644" },
    { source = "target/assets/anchor.fish", dest = "/usr/share/fish/vendor_completions.d/anchor.fish", mode = "644" },
    { source = "target/assets/anchor.1", dest = "/usr/share/man/man1/anchor.1", mode = "644", doc = true },
]
[package.metadata.generate-rpm.recommends]
git = "*"

# `cargo binstall anchor` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/anchor-{ version }-{ target }.tar.gz"
bin-dir = "anchor-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/anchor-{ version }-{ target }.zip"
